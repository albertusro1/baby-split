name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} build-output/baby-split.apk \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: baby-split
          path: build-output/baby-split.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          if-no-files-found: ignore
          retention-days: 7
